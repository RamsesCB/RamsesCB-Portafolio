        /* =========================================================
   FLOATING BACK-TO-ARCADE BUTTON (Main Portfolio Screen)
   ========================================================= */
.portfolio-back-arcade-btn {
  position: fixed;
  top: calc(0.85rem + var(--sat, 0px)) !important;
  left: calc(0.85rem + var(--sal, 0px)) !important;
  z-index: 80;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  background: rgba(15, 23, 42, 0.9) !important;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.22) !important;
  color: #f8fafc !important;
  padding: 0.45rem 1.05rem !important;
  min-height: 44px !important;
  min-width: 44px !important;
  border-radius: 9999px !important;
  font-size: 0.72rem !important;
  font-weight: 700 !important;
  letter-spacing: 0.16em !important;
  text-transform: uppercase !important;
  cursor: pointer !important;
  text-decoration: none !important;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5) !important;
  user-select: none !important;
  -webkit-user-select: none !important;
  touch-action: manipulation !important;
  -webkit-tap-highlight-color: transparent !important;
}
.portfolio-back-arcade-btn:hover {
  background: #ffffff !important;
  color: #05080c !important;
  border-color: #ffffff !important;
  transform: translateX(-3px) !important;
  box-shadow: 0 12px 32px rgba(255, 255, 255, 0.25) !important;
}
.portfolio-back-arcade-btn:active {
  transform: scale(0.96) !important;
}
.portfolio-back-arcade-btn .arcade-btn-arrow {
  font-size: 0.85rem;
  transition: transform 0.2s ease;
}
.portfolio-back-arcade-btn:hover .arcade-btn-arrow {
  transform: translateX(-2px);
}

/* =========================================================
   IMMERSIVE STAGE THEMES (APPLE LUXURY DARK AESTHETIC)
   ========================================================= */
.stage-theme-anime { --theme-accent: #38BDF8; --theme-glow: rgba(56, 189, 248, 0.25); }
.stage-theme-caricatura { --theme-accent: #F87171; --theme-glow: rgba(248, 113, 113, 0.25); }
.stage-theme-elegancia { --theme-accent: #FBBF24; --theme-glow: rgba(251, 191, 36, 0.25); }
.stage-theme-edicion { --theme-accent: #2DD4BF; --theme-glow: rgba(45, 212, 191, 0.25); }
.stage-theme-superheroe { --theme-accent: #60A5FA; --theme-glow: rgba(96, 165, 250, 0.25); }

.immersive-stage-wrapper {
  position: fixed !important;
  inset: 0 !important;
  z-index: 9999 !important;
  width: 100vw !important;
  height: 100% !important;
  min-height: 100vh !important;
  min-height: -webkit-fill-available !important;
  min-height: 100dvh !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
  -webkit-overflow-scrolling: touch !important;
  overscroll-behavior-y: contain !important;
  background: #07090E !important;
  color: #F8FAFC !important;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif !important;
  -webkit-font-smoothing: antialiased !important;
  -moz-osx-font-smoothing: grayscale !important;
  scroll-behavior: smooth !important;
  box-sizing: border-box !important;
  padding-bottom: var(--sab, 0px) !important;
}

.stage-theme-anime.phase-intro { background: #060910 !important; }
.stage-theme-anime.phase-library {
  background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(56, 189, 248, 0.15) 0%, #07090E 70%) !important;
}

.stage-theme-caricatura.phase-intro { background: #120708 !important; }
.stage-theme-caricatura.phase-library {
  background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(248, 113, 113, 0.15) 0%, #07090E 70%) !important;
}

.stage-theme-elegancia.phase-intro { background: #0E0C08 !important; }
.stage-theme-elegancia.phase-library {
  background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(251, 191, 36, 0.14) 0%, #07090E 70%) !important;
}

.stage-theme-edicion.phase-intro { background: #050E0E !important; }
.stage-theme-edicion.phase-library {
  background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(45, 212, 191, 0.14) 0%, #07090E 70%) !important;
}

.stage-theme-superheroe.phase-intro { background: #060A14 !important; }
.stage-theme-superheroe.phase-library {
  background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(96, 165, 250, 0.16) 0%, #07090E 70%) !important;
}

/* =========================================================
   COMPACT APPLE-STYLE BACK PILL BUTTON (Trimmed & Sleek)
   ========================================================= */
.apple-compact-back-btn {
  position: fixed !important;
  top: calc(0.85rem + var(--sat, 0px)) !important;
  left: calc(0.85rem + var(--sal, 0px)) !important;
  z-index: 1000 !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 0.5rem !important;
  padding: 0.45rem 0.95rem !important;
  min-height: 44px !important;
  min-width: 44px !important;
  border-radius: 9999px !important;
  background: rgba(15, 23, 42, 0.8) !important;
  border: 1px solid rgba(255, 255, 255, 0.16) !important;
  backdrop-filter: blur(20px) !important;
  -webkit-backdrop-filter: blur(20px) !important;
  color: #F8FAFC !important;
  font-size: 0.75rem !important;
  font-weight: 600 !important;
  letter-spacing: 0.04em !important;
  cursor: pointer !important;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35) !important;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
  user-select: none !important;
  -webkit-user-select: none !important;
  touch-action: manipulation !important;
  -webkit-tap-highlight-color: transparent !important;
}
.apple-compact-back-btn:hover {
  background: rgba(30, 41, 59, 0.95) !important;
  border-color: rgba(255, 255, 255, 0.3) !important;
  transform: translateY(-1px) !important;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5) !important;
}
.apple-compact-back-btn:active {
  transform: scale(0.96) !important;
}
@media (max-width: 768px), (hover: none) {
  .apple-compact-back-btn .apple-kbd {
    display: none !important;

  .apple-compact-back-btn::before {
    content: "←" !important;

    font-weight: 700 !important;

}
.apple-kbd {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  padding: 0.12rem 0.38rem !important;
  border-radius: 5px !important;
  background: rgba(255, 255, 255, 0.1) !important;
  border: 1px solid rgba(255, 255, 255, 0.16) !important;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
  font-size: 0.62rem !important;
  font-weight: 700 !important;
  color: #94A3B8 !important;
}
.back-label {
  font-size: 0.72rem !important;
  color: #F1F5F9 !important;
}

/* =========================================================
   INTRO STAGE & AESTHETIC APPLE SKIP BUTTON (Pill Glass)
   ========================================================= */
.intro-stage {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  height: 100dvh !important;
  z-index: 50 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  overflow: hidden !important;
}

.intro-top-progress {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  height: 3px !important;
  background: linear-gradient(90deg, rgba(255,255,255,0.4), #FFFFFF) !important;
  box-shadow: 0 0 12px rgba(255, 255, 255, 0.8) !important;
  z-index: 1000 !important;
  transition: width 0.1s linear !important;
}

.intro-skip-btn {
  position: fixed !important;

  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 0.55rem !important;

  min-height: 40px !important;
  border-radius: 9999px !important;
  background: rgba(15, 23, 42, 0.8) !important;

  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif !important;

  font-weight: 600 !important;
  letter-spacing: 0.03em !important;
  cursor: pointer !important;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1) !important;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;

  -webkit-user-select: none !important;
  touch-action: manipulation !important;
  -webkit-tap-highlight-color: transparent !important;

  background: rgba(30, 41, 59, 0.95) !important;

  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55) !important;

}

.intro-skip-btn:active {
  transform: scale(0.96) !important;
}

  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  padding: 0.14rem 0.4rem !important;
  border-radius: 5px !important;
  background: rgba(255, 255, 255, 0.1) !important;
  border: 1px solid rgba(255, 255, 255, 0.16) !important;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;

  font-weight: 700 !important;
  color: #94A3B8 !important;
  line-height: 1 !important;
}

  color: #F1F5F9 !important;

}

.intro-skip-arrow {
  font-size: 0.95rem !important;

  color: #FFFFFF !important;

}

.intro-unmute-btn {
  position: fixed !important;
  top: calc(1.15rem + var(--sat, 0px)) !important;

  align-items: center !important;
  gap: 0.5rem !important;
  padding: 0.45rem 1rem !important;

  border-radius: 9999px !important;
  background: rgba(16, 185, 129, 0.25) !important;
  border: 1px solid rgba(52, 211, 153, 0.4) !important;
  backdrop-filter: blur(20px) !important;

  color: #A7F3D0 !important;
  font-size: 0.74rem !important;
  font-weight: 700 !important;
  letter-spacing: 0.05em !important;
  cursor: pointer !important;
  box-shadow: 0 8px 24px rgba(16, 185, 129, 0.2) !important;
  transition: all 0.2s ease !important;
}

@media (max-width: 768px), (hover: none) {
  .intro-skip-btn .intro-skip-badge {
    display: none !important;
  }
  .intro-skip-btn {
    top: calc(0.85rem + var(--sat, 0px)) !important;
    right: calc(0.85rem + var(--sar, 0px)) !important;
    padding: 0.42rem 0.9rem !important;
  }
}

/* =========================================================

  font-weight: 800 !important;
  z-index: 5 !important;
  background: rgba(15, 23, 42, 0.88) !important;

.prompt-badge-dot {

  height: 6px !important;

}

.prompt-box-content {

}

.prompt-box-title {

  font-weight: 700 !important;
  margin: 0 0 0.45rem 0 !important;
  line-height: 1.35 !important;
  color: #F8FAFC !important;
  letter-spacing: -0.018em !important;
}

.prompt-box-desc {

  line-height: 1.6 !important;
  color: #94A3B8 !important;
  margin: 0 0 1rem 0 !important;
}

.prompt-card-pills-row {

  flex-wrap: wrap !important;

}
.prompt-card-pill {
  padding: 0.18rem 0.55rem !important;
  border-radius: 6px !important;
  font-size: 0.65rem !important;
  font-weight: 600 !important;
  letter-spacing: 0.04em !important;
  background: rgba(255, 255, 255, 0.05) !important;
  border: 1px solid rgba(255, 255, 255, 0.08) !important;
  color: #CBD5E1 !important;
}

.prompt-syntax-box {

  border: 1px solid rgba(255, 255, 255, 0.08) !important;

  padding: 0.65rem 0.85rem !important;
  margin-bottom: 1.15rem !important;
  cursor: pointer !important;
  position: relative !important;
  transition: all 0.2s ease !important;
  user-select: none !important;
}
.prompt-syntax-box:hover {
  background: rgba(0, 0, 0, 0.55) !important;
  border-color: rgba(255, 255, 255, 0.18) !important;
  box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.4) !important;
}
.prompt-syntax-header {
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  margin-bottom: 0.45rem !important;
  padding-bottom: 0.35rem !important;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
}
.prompt-syntax-dots {
  display: flex !important;
  gap: 4px !important;
}
.syntax-dot {
  width: 7px !important;
  height: 7px !important;
  border-radius: 50% !important;
  display: inline-block !important;
}

.prompt-syntax-label {
  font-family: ui-monospace, SFMono-Regular, monospace !important;
  font-size: 0.62rem !important;

}
.prompt-syntax-hint {

}
.prompt-syntax-text {

  gap: 0.55rem !important;
  width: 100% !important;
}

.prompt-command-btn {
  flex: 1.5 !important;
  padding: 0.72rem 1rem !important;
  border-radius: 12px !important;
  font-size: 0.75rem !important;
  font-weight: 700 !important;
  letter-spacing: 0.05em !important;
  text-transform: uppercase !important;
  cursor: pointer !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 0.5rem !important;
  background: linear-gradient(135deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.03) 100%) !important;
  border: 1px solid rgba(255, 255, 255, 0.14) !important;
  color: #F8FAFC !important;
  backdrop-filter: blur(12px) !important;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3) !important;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
  user-select: none !important;
  min-height: 42px !important;
}
.prompt-command-btn:hover {

}
.prompt-command-btn:active {

}
.prompt-command-btn.btn-copied {
  background: #059669 !important;
  border-color: #10B981 !important;
  color: #FFFFFF !important;
  box-shadow: 0 0 25px rgba(16, 185, 129, 0.5) !important;
}

.prompt-json-btn {
  flex: 1 !important;
  padding: 0.72rem 0.85rem !important;
  border-radius: 12px !important;
  font-family: ui-monospace, SFMono-Regular, monospace !important;
  font-size: 0.74rem !important;
  font-weight: 700 !important;
  letter-spacing: 0.04em !important;
  cursor: pointer !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 0.4rem !important;
  background: rgba(0, 0, 0, 0.45) !important;
  border: 1px solid rgba(255, 255, 255, 0.1) !important;
  color: #CBD5E1 !important;
  backdrop-filter: blur(12px) !important;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;

}
.prompt-json-btn:hover {
  background: rgba(255, 255, 255, 0.1) !important;
  border-color: rgba(255, 255, 255, 0.25) !important;

}
.prompt-json-btn:active {

}

.json-modal-backdrop {

}

.json-modal-header {

}

.json-modal-title-group {

.json-modal-badge {

.json-modal-title {

    var particles = [];
    var numParticles = 65;
    for (var i = 0; i < numParticles; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2.5 + 1.2,
        vx: (Math.random() - 0.5) * 3,
        vy: (Math.random() - 0.5) * 3,

      var sub = Math.pow(Math.max(0, Math.sin(t * 3.75 + 0.3)), 4);
      var intensity = kick * 0.85 + sub * 0.45;

      // 1. Equalizer bars along the bottom edge

      for (var b = 0; b < numBars; b++) {

        var barHeight = 15 + Math.sin(barPhase) * 12 + Math.cos(barPhase * 0.7) * 8 + intensity * 60;
        var bx = b * (barWidth + 4);

        if (type === "anime") ctx.fillStyle = "rgba(2, 132, 199, " + (0.25 + intensity * 0.55) + ")";
        else if (type === "caricatura") ctx.fillStyle = "rgba(224, 72, 72, " + (0.25 + intensity * 0.55) + ")";
        else if (type === "elegancia") ctx.fillStyle = "rgba(197, 160, 89, " + (0.25 + intensity * 0.55) + ")";
        else if (type === "edicion") ctx.fillStyle = "rgba(14, 116, 144, " + (0.25 + intensity * 0.55) + ")";
        else ctx.fillStyle = "rgba(37, 99, 235, " + (0.25 + intensity * 0.55) + ")";

        ctx.fillRect(bx, h - barHeight, barWidth, barHeight);

        else if (type === "edicion") ctx.fillStyle = "rgba(34, 211, 238, " + (pt.alpha + intensity * 0.4) + ")";
        else ctx.fillStyle = "rgba(96, 165, 250, " + (pt.alpha + intensity * 0.4) + ")";

function getPromptMetadata(item, categoryKey, index) {
  var cat = categoryKey || "caricatura";
  var id = item.id || (cat.toUpperCase() + "-" + (index + 1 < 10 ? "0" + (index + 1) : (index + 1)));
  return {
    id: id,
    title: item.title || ("Prompt #" + (index + 1)),

    engine: (item.parameters && item.parameters.v) ? ("Midjourney v" + item.parameters.v) : "Midjourney / Flux / Meta AI",
    prompt: item.prompt || "",

    image_source: item.image || item.resultImage || "",
    author: "RamsesCB / Taller IA 2026",
    status: "Verified & Ready",
    export_date: "2026-11-03"
  };
}

/* =========================================================
   JSON INSPECTOR MODAL
   ========================================================= */
function JsonInspectorModal(props) {
  var isOpen = props.isOpen;
  var onClose = props.onClose;
  var jsonData = props.jsonData;
  var [copied, setCopied] = uA.useState(false);

  uA.useEffect(function() {
    function onKeyDown(e) {
      if (e.key === "Escape") {
        e.stopPropagation();
        onClose();
      }
    }
    if (isOpen) {
      window.addEventListener("keydown", onKeyDown, true);
    }
    return function() {
      window.removeEventListener("keydown", onKeyDown, true);
    };
  }, [isOpen, onClose]);

  if (!isOpen || !jsonData) return null;

  var jsonString = JSON.stringify(jsonData, null, 2);

  function copyJson(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(jsonString).then(function() {
        setCopied(true);
        setTimeout(function() { setCopied(false); }, 2200);
      });
    } else {
      var t = document.createElement("textarea");
      t.value = jsonString;
      document.body.appendChild(t);
      t.select();
      document.execCommand("copy");
      document.body.removeChild(t);
      setCopied(true);
      setTimeout(function() { setCopied(false); }, 2200);
    }
  }

  function downloadJson(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    try {
      var blob = new Blob([jsonString], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = (jsonData.id || "prompt-data") + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      console.warn("Download error", err);
    }
  }

  return Z("div", {
    className: "json-modal-backdrop",
    onClick: onClose,
    children: Z("div", {
      className: "json-modal-card",
      onClick: function(e) { e.stopPropagation(); },
      children: [
        Z("div", {
          className: "json-modal-header",
          children: [
            Z("div", {
              className: "json-modal-title-group",
              children: [
                Z("span", { className: "json-modal-badge", children: jsonData.id }),
                Z("h3", { className: "json-modal-title", children: jsonData.title })
              ]
            }),
            Z("button", {
              type: "button",
              className: "json-modal-close-btn",
              onClick: onClose,
              title: "Cerrar (Esc)",
              children: "✕"
            })
          ]
        }),
        Z("div", {
          className: "json-modal-body",
          children: Z("pre", {
            className: "json-modal-code",
            children: jsonString
          })
        }),
        Z("div", {
          className: "json-modal-footer",
          children: [
            Z("button", {
              type: "button",
              className: "json-action-btn json-action-dl",
              onClick: downloadJson,
              children: "⬇ Descargar .json"
            }),
            Z("button", {
              type: "button",
              className: "json-action-btn json-action-copy" + (copied ? " copied" : ""),
              onClick: copyJson,
              children: copied ? "✓ ¡JSON Copiado!" : "📋 Copiar JSON Completo"
            })
          ]
        })
      ]
    })
  });
}

   ========================================================= */
function PromptCardBox(props) {
  var item = props.item;
  var themeClass = props.themeClass;
  var isFocused = props.isFocused;
  var cardIndex = props.cardIndex;
  var cardRef = props.cardRef;
  var categoryKey = props.categoryKey || "caricatura";

  var [copied, setCopied] = uA.useState(false);
  var [imgLoaded, setImgLoaded] = uA.useState(false);
  var [isHovered, setIsHovered] = uA.useState(false);
  var [isJsonModalOpen, setIsJsonModalOpen] = uA.useState(false);

  var metadata = getPromptMetadata(item, categoryKey, cardIndex);

  function executeCopy(textToCopy) {
    var text = textToCopy || item.prompt;
    var markCopied = function() {
      setCopied(true);
      try { if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(25); } catch (_) {}
      setTimeout(function() { setCopied(false); }, 2200);
    };

    if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(markCopied).catch(function() {
        fallbackCopy(text, markCopied);
      });
    } else {
      fallbackCopy(text, markCopied);
    }
  }

  function fallbackCopy(str, cb) {
    try {
      var t = document.createElement("textarea");
      t.value = str;
      t.setAttribute("readonly", "");
      t.style.position = "fixed";
      t.style.top = "0";
      t.style.left = "0";
      t.style.width = "2em";
      t.style.height = "2em";
      t.style.padding = "0";
      t.style.border = "none";
      t.style.outline = "none";
      t.style.boxShadow = "none";
      t.style.background = "transparent";
      t.style.fontSize = "16px";
      t.style.opacity = "0.01";
      t.style.zIndex = "-1";
      document.body.appendChild(t);
      t.focus();
      t.select();
      t.setSelectionRange(0, 99999);
      var ok = document.execCommand("copy");
      document.body.removeChild(t);
      cb();
    } catch (err) {
      console.warn("Copy fallback error", err);
      cb();
    }
  }

  function copyPrompt(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    executeCopy(item.prompt);
  }

  function openJsonModal(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    setIsJsonModalOpen(true);
  }

  uA.useEffect(function() {
    if (isFocused) {
      window.copyPromptGlobal = function(text, idx) {
        if (idx === cardIndex) {
          executeCopy(text);
        }
      };
    }
  }, [isFocused, cardIndex, item.prompt]);

  return Z("div", {
    ref: cardRef,
    tabIndex: 0,
    className: "prompt-box " + (isHovered ? "box-active-hover " : "") + (isFocused ? "box-keyboard-focused " : "") + (item.isComparison ? "prompt-box-comparison" : ""),
    onMouseEnter: function() { setIsHovered(true); },
    onMouseLeave: function() { setIsHovered(false); },
    children: [
      item.isComparison ? Z(BeforeAfterComparisonImage, {
        firstImage: item.image,
        secondImage: item.resultImage || item.originalImage,
        title: item.title,
        badge: item.badge
      }) : Z("div", {
        className: "prompt-box-image-wrap",
        children: [
          !imgLoaded ? Z("div", {
            className: "apple-skeleton-wrapper",
            children: Z("div", { className: "apple-skeleton-shimmer" })
          }) : null,

          Z("div", {
            className: "prompt-box-ambient-blur",
            style: { backgroundImage: "url(" + item.image + ")" }
          }),

          Z("img", {
            src: item.image,
            alt: item.title,
            className: "prompt-box-img " + (imgLoaded ? "img-visible" : "img-loading"),
            loading: "lazy",
            decoding: "async",
            draggable: false,
            onLoad: function() { setImgLoaded(true); }
          }),

          Z("div", {
            className: "prompt-box-badge",
            children: [
              Z("span", { className: "prompt-badge-dot" }),
              item.badge || ("#" + (cardIndex + 1))
            ]
          }),

          Z("div", {
            className: "prompt-card-top-actions",
            children: [
              Z("button", {
                type: "button",
                className: "prompt-quick-btn" + (copied ? " quick-copied" : ""),
                onClick: copyPrompt,
                title: copied ? "¡Copiado!" : "Copiar prompt al portapapeles",
                children: copied ? "✓" : "📋"
              }),
              Z("button", {
                type: "button",
                className: "prompt-quick-btn",
                onClick: openJsonModal,
                title: "Extraer e inspeccionar JSON",
                children: "{ }"
              })
            ]
          })
        ]
      }),

      Z("div", {
        className: "prompt-box-content",
        children: [
          Z("div", {
            children: [
              Z("h3", {
                className: "prompt-box-title",
                children: item.title
              }),
              Z("p", {
                className: "prompt-box-desc",
                children: item.description
              }),

              Z("div", {
                className: "prompt-card-pills-row",
                children: [
                  Z("span", { className: "prompt-card-pill", children: "📸 " + (item.referenceRequirements || "1 FOTO REF") }),
                  Z("span", { className: "prompt-card-pill", children: (item.parameters && item.parameters.v) ? ("V" + item.parameters.v + " • 8K") : "MIDJOURNEY / FLUX" }),
                  Z("span", { className: "prompt-card-pill", children: "AR " + ((item.parameters && item.parameters.ar) || "4:5") })
                ]
              }),

              Z("div", {
                className: "prompt-syntax-box",
                onClick: copyPrompt,
                title: "Haz clic para copiar este prompt",
                children: [
                  Z("div", {
                    className: "prompt-syntax-header",
                    children: [
                      Z("div", {
                        className: "prompt-syntax-dots",
                        children: [
                          Z("span", { className: "syntax-dot syntax-dot-red" }),
                          Z("span", { className: "syntax-dot syntax-dot-amber" }),
                          Z("span", { className: "syntax-dot syntax-dot-green" })
                        ]
                      }),
                      Z("span", {
                        className: "prompt-syntax-label",
                        children: "PROMPT TEXT"
                      }),
                      Z("span", {
                        className: "prompt-syntax-hint",
                        children: copied ? "✓ COPIADO" : "CLIC PARA COPIAR ↵"
                      })
                    ]
                  }),
                  Z("p", {
                    className: "prompt-syntax-text",
                    children: item.prompt
                  })
                ]
              })
            ]
          }),

          Z("div", {
            className: "prompt-card-actions",
            children: [
              Z("button", {
                type: "button",
                onClick: copyPrompt,
                className: "prompt-command-btn" + (copied ? " btn-copied" : ""),
                children: copied ? "✓ ¡PROMPT COPIADO!" : "📋 COPIAR PROMPT"
              }),
              Z("button", {
                type: "button",
                onClick: openJsonModal,
                className: "prompt-json-btn",
                title: "Extraer metadata y JSON estructurado",
                children: "{ } JSON"
              })
            ]
          })
        ]
      }),

      Z(JsonInspectorModal, {
        isOpen: isJsonModalOpen,
        onClose: function() { setIsJsonModalOpen(false); },
        jsonData: metadata
      })
    ]
  });
}
