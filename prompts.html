        /* =========================================================
   FLOATING BACK-TO-ARCADE BUTTON (Main Portfolio Screen)
   ========================================================= */
.portfolio-back-arcade-btn {
  position: fixed;
  top: 1.15rem;
  left: 1.25rem;
  z-index: 80;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background: rgba(15, 23, 42, 0.9) !important;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.22) !important;
  color: #f8fafc !important;
  padding: 0.45rem 1.05rem !important;
  border-radius: 9999px !important;
  font-size: 0.7rem !important;
  font-weight: 700 !important;
  letter-spacing: 0.16em !important;
  text-transform: uppercase !important;
  cursor: pointer !important;
  text-decoration: none !important;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5) !important;
}
.portfolio-back-arcade-btn:hover {
  background: #ffffff !important;
  color: #05080c !important;
  border-color: #ffffff !important;
  transform: translateX(-3px) !important;
  box-shadow: 0 12px 32px rgba(255, 255, 255, 0.25) !important;
}
.portfolio-back-arcade-btn .arcade-btn-arrow {
  font-size: 0.85rem;
  transition: transform 0.2s ease;
}
.portfolio-back-arcade-btn:hover .arcade-btn-arrow {
  transform: translateX(-2px);
}

/* =========================================================
   IMMERSIVE STAGE THEMES (INTRO & LIBRARY PHASES)
   ========================================================= */
.stage-theme-anime.phase-intro { background: #090f18 !important; color: #f0f6fc !important; }
.stage-theme-anime.phase-library {
  background: radial-gradient(ellipse at 50% 15%, #FFFFFF 0%, #F1F5F9 65%, #E2E8F0 100%) !important;
  color: #0F172A !important;
}

.stage-theme-caricatura.phase-intro { background: #1a0909 !important; color: #fff1f1 !important; }
.stage-theme-caricatura.phase-library {
  background: radial-gradient(ellipse at 50% 15%, #FFFFFF 0%, #FFF2EE 65%, #FFE2D8 100%) !important;
  color: #1C1917 !important;
}

.stage-theme-elegancia.phase-intro { background: #0d0c0a !important; color: #f7f3ea !important; }
.stage-theme-elegancia.phase-library {
  background: radial-gradient(ellipse at 50% 15%, #FFFFFF 0%, #FAF7F2 65%, #F0E8D8 100%) !important;
  color: #1A1612 !important;
}

.stage-theme-edicion.phase-intro { background: #060d14 !important; color: #ecfeff !important; }
.stage-theme-edicion.phase-library {
  background: radial-gradient(ellipse at 50% 15%, #FFFFFF 0%, #F0F5F8 65%, #E2EBF0 100%) !important;
  color: #0F172A !important;
}

.stage-theme-superheroe.phase-intro { background: #080f1e !important; color: #eff6ff !important; }
.stage-theme-superheroe.phase-library {
  background: radial-gradient(ellipse at 50% 15%, #FFFFFF 0%, #EFF6FF 65%, #DBEAFE 100%) !important;
  color: #0B192C !important;
}

/* =========================================================
   LIBRARY TOP-LEFT RETURN BUTTON (All 5 Categories)
   ========================================================= */
.library-floating-exit-btn {
  position: fixed !important;
  top: 1.75rem !important;
  left: 2rem !important;
  z-index: 100 !important;
  display: inline-flex !important;
  align-items: center !important;
  gap: 0.65rem !important;
  background: #FFFFFF !important;
  backdrop-filter: blur(16px) !important;
  -webkit-backdrop-filter: blur(16px) !important;
  padding: 0.55rem 1.35rem !important;
  border-radius: 9999px !important;
  font-size: 0.75rem !important;
  font-weight: 700 !important;
  letter-spacing: 0.14em !important;
  text-transform: uppercase !important;
  cursor: pointer !important;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08) !important;
}
.library-floating-exit-btn:hover {
  transform: translateY(-2px) scale(1.02) !important;
  box-shadow: 0 14px 30px rgba(0, 0, 0, 0.16) !important;
}
.exit-arrow {
  font-size: 0.95rem;
  line-height: 1;
}
.exit-key-badge {
  padding: 0.15rem 0.45rem !important;
  border-radius: 4px !important;
  font-size: 0.65rem !important;
  font-family: monospace !important;
  font-weight: 800 !important;
}

/* Exit button accents per category */
.stage-theme-anime.phase-library .library-floating-exit-btn {
  border: 1.5px solid #0284C7 !important;
  color: #0F172A !important;
}
.stage-theme-anime.phase-library .exit-key-badge {
  background: rgba(2, 132, 199, 0.15) !important;
  color: #0284C7 !important;
}
.stage-theme-anime.phase-library .library-floating-exit-btn:hover {
  background: #0F172A !important;
  color: #F8FAFC !important;
  border-color: #0F172A !important;
}

.stage-theme-caricatura.phase-library .library-floating-exit-btn {
  border: 1.5px solid #E04848 !important;
  color: #1C1917 !important;
}
.stage-theme-caricatura.phase-library .exit-key-badge {
  background: rgba(224, 72, 72, 0.15) !important;
  color: #E04848 !important;
}
.stage-theme-caricatura.phase-library .library-floating-exit-btn:hover {
  background: #1C1917 !important;
  color: #FFF5F5 !important;
  border-color: #1C1917 !important;
}

.stage-theme-elegancia.phase-library .library-floating-exit-btn {
  border: 1.5px solid #C5A059 !important;
  color: #1A1612 !important;
}
.stage-theme-elegancia.phase-library .exit-key-badge {
  background: rgba(197, 160, 89, 0.18) !important;
  color: #996515 !important;
}
.stage-theme-elegancia.phase-library .library-floating-exit-btn:hover {
  background: #1A1612 !important;
  color: #FAF8F5 !important;
  border-color: #1A1612 !important;
}

.stage-theme-edicion.phase-library .library-floating-exit-btn {
  border: 1.5px solid #0E7490 !important;
  color: #0F172A !important;
}
.stage-theme-edicion.phase-library .exit-key-badge {
  background: rgba(14, 116, 144, 0.15) !important;
  color: #0E7490 !important;
}
.stage-theme-edicion.phase-library .library-floating-exit-btn:hover {
  background: #0F172A !important;
  color: #ECFEFF !important;
  border-color: #0F172A !important;
}

.stage-theme-superheroe.phase-library .library-floating-exit-btn {
  border: 1.5px solid #2563EB !important;
  color: #0B192C !important;
}
.stage-theme-superheroe.phase-library .exit-key-badge {
  background: rgba(37, 99, 235, 0.15) !important;
  color: #2563EB !important;
}
.stage-theme-superheroe.phase-library .library-floating-exit-btn:hover {
  background: #0B192C !important;
  color: #EFF6FF !important;
  border-color: #0B192C !important;
}

/* =========================================================
   PERIPHERAL CORNER METADATA (Fill empty corners minimally)
   ========================================================= */
.prompts-corner-meta {
  position: fixed !important;
  z-index: 90 !important;
  display: flex !important;
  flex-direction: column !important;
  pointer-events: none !important;
}
.corner-tr {
  top: 1.85rem !important;
  right: 2.25rem !important;
  text-align: right !important;
}
.corner-bl {
  bottom: 1.6rem !important;
  left: 2.25rem !important;
  text-align: left !important;
}
.corner-br {
  bottom: 1.6rem !important;
  right: 2.25rem !important;
  text-align: right !important;
}
.meta-tag {
  font-family: monospace !important;
  font-size: 0.72rem !important;
  font-weight: 700 !important;
  letter-spacing: 0.16em !important;
  text-transform: uppercase !important;
  opacity: 0.82 !important;
}
.meta-sub {
  font-family: monospace !important;
  font-size: 0.62rem !important;
  font-weight: 600 !important;
  letter-spacing: 0.12em !important;
  text-transform: uppercase !important;
  opacity: 0.55 !important;
  margin-top: 0.2rem !important;
}
@media (max-width: 900px) {
  .prompts-corner-meta { display: none !important; }
}

/* =========================================================
   PROMPTS HEADER, HERO, & BIO STYLES
   ========================================================= */
.prompts-hero-center {
  margin-left: auto !important;
  margin-right: auto !important;
  max-width: 900px !important;
  padding-left: 2rem !important;
  padding-right: 2rem !important;
  margin-top: clamp(80px, 15vh, 150px) !important;
  margin-bottom: 2.8rem !important;
  text-align: center !important;
  box-sizing: border-box !important;
}

.hero-title-main {
  font-size: clamp(2.4rem, 4.8vw, 3.8rem) !important;
  font-weight: 800 !important;
  letter-spacing: 0.04em !important;
  line-height: 1.15 !important;
  margin: 0 !important;
}
.stage-theme-anime .hero-title-main { font-family: 'Comic Sans MS', cursive, sans-serif !important; color: #0F172A !important; }
.stage-theme-caricatura .hero-title-main { font-family: 'Comic Sans MS', 'Inter', cursive, sans-serif !important; color: #1C1917 !important; }
.stage-theme-elegancia .hero-title-main { font-family: 'Times New Roman', Georgia, serif !important; font-weight: 400 !important; color: #1A1612 !important; letter-spacing: 0.08em !important; }
.stage-theme-edicion .hero-title-main { font-family: 'Space Grotesk', sans-serif !important; color: #0F172A !important; text-transform: uppercase !important; }
.stage-theme-superheroe .hero-title-main { font-family: 'Inter', sans-serif !important; color: #0B192C !important; text-transform: uppercase !important; letter-spacing: 0.06em !important; }

/* Divider line */
.prompts-divider-wrapper { width: 100% !important; box-sizing: border-box !important; }
.prompts-divider-line {
  width: 100% !important;
  height: 3px !important;
  border: none !important;
  margin: 1.5rem 0 1.35rem 0 !important;
}
.stage-theme-anime .prompts-divider-line { background: linear-gradient(90deg, transparent, #0284C7 20%, #0369A1 50%, #0284C7 80%, transparent) !important; }
.stage-theme-caricatura .prompts-divider-line { background: linear-gradient(90deg, transparent, #E04848 20%, #B91C1C 50%, #E04848 80%, transparent) !important; }
.stage-theme-elegancia .prompts-divider-line { background: linear-gradient(90deg, transparent, #C5A059 20%, #996515 50%, #C5A059 80%, transparent) !important; }
.stage-theme-edicion .prompts-divider-line { background: linear-gradient(90deg, transparent, #0E7490 20%, #0891B2 50%, #0E7490 80%, transparent) !important; }
.stage-theme-superheroe .prompts-divider-line { background: linear-gradient(90deg, transparent, #2563EB 20%, #1D4ED8 50%, #2563EB 80%, transparent) !important; }

/* Bio Description: Warm, extensive, well formatted */
.prompts-bio-container {
  text-align: left !important;
  margin: 1.35rem 0 1.85rem 0 !important;
  box-sizing: border-box !important;
}
.prompts-bio-text {
  font-size: clamp(0.95rem, 1.4vw, 1.15rem) !important;
  line-height: 1.7 !important;
  margin: 0 !important;
}
.stage-theme-anime .prompts-bio-text { font-family: 'Inter', sans-serif !important; color: #334155 !important; }
.stage-theme-caricatura .prompts-bio-text { font-family: 'Inter', sans-serif !important; color: #3F3F46 !important; }
.stage-theme-elegancia .prompts-bio-text { font-family: 'Times New Roman', Georgia, serif !important; font-style: italic !important; color: #44372C !important; }
.stage-theme-edicion .prompts-bio-text { font-family: 'Inter', sans-serif !important; color: #334155 !important; }
.stage-theme-superheroe .prompts-bio-text { font-family: 'Inter', sans-serif !important; color: #1E293B !important; }

/* Tags row */
.prompts-article-tags {
  display: flex !important;
  flex-wrap: wrap !important;
  align-items: center !important;
  gap: 0.65rem !important;
  padding: 1.15rem 0 !important;
  border-top: 1px solid rgba(0, 0, 0, 0.08) !important;
  border-bottom: 1px solid rgba(0, 0, 0, 0.08) !important;
  margin-bottom: 3.5rem !important;
}
.article-tag-item {
  padding: 0.4rem 0.95rem !important;
  border-radius: 9999px !important;
  font-size: 0.7rem !important;
  letter-spacing: 0.14em !important;
  text-transform: uppercase !important;
  font-weight: 700 !important;
  background: #FFFFFF !important;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05) !important;
}
.stage-theme-anime .article-tag-item { border: 1px solid rgba(2, 132, 199, 0.35) !important; color: #0369A1 !important; font-family: 'Comic Sans MS', cursive, sans-serif !important; }
.stage-theme-caricatura .article-tag-item { border: 1px solid rgba(224, 72, 72, 0.35) !important; color: #B91C1C !important; }
.stage-theme-elegancia .article-tag-item { border: 1px solid rgba(197, 160, 89, 0.45) !important; color: #785A28 !important; font-family: 'Times New Roman', Georgia, serif !important; }
.stage-theme-edicion .article-tag-item { border: 1px solid rgba(14, 116, 144, 0.35) !important; color: #0E7490 !important; }
.stage-theme-superheroe .article-tag-item { border: 1px solid rgba(37, 99, 235, 0.35) !important; color: #1D4ED8 !important; }

/* =========================================================
   PROMPTS GRID & LUXURY CARDS (All 5 Categories)
   ========================================================= */
.prompts-grid {
  display: grid !important;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)) !important;
  gap: 5% !important;
  padding: 0 4vw !important;
  box-sizing: border-box !important;
  width: 100% !important;
}

.prompt-box {
  position: relative !important;
  background: #FFFFFF !important;
  border-radius: 16px !important;
  overflow: hidden !important;
  display: flex !important;
  flex-direction: column !important;
  justify-content: space-between !important;
  box-sizing: border-box !important;
  box-shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.07), 0 4px 10px -2px rgba(0, 0, 0, 0.03) !important;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1) !important;
}
.prompt-box:hover, .prompt-box.box-active-hover {

    var numParticles = 65;
    for (var i = 0; i < numParticles; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2.5 + 1.2,
        vx: (Math.random() - 0.5) * 3,
        vy: (Math.random() - 0.5) * 3,

      var sub = Math.pow(Math.max(0, Math.sin(t * 3.75 + 0.3)), 4);
      var intensity = kick * 0.85 + sub * 0.45;

      // 1. Equalizer bars along the bottom edge
      var numBars = Math.floor(w / 18);
      var barWidth = w / numBars - 4;
      for (var b = 0; b < numBars; b++) {

        var barHeight = 15 + Math.sin(barPhase) * 12 + Math.cos(barPhase * 0.7) * 8 + intensity * 60;
        var bx = b * (barWidth + 4);

        if (type === "anime") ctx.fillStyle = "rgba(2, 132, 199, " + (0.25 + intensity * 0.55) + ")";
        else if (type === "caricatura") ctx.fillStyle = "rgba(224, 72, 72, " + (0.25 + intensity * 0.55) + ")";
        else if (type === "elegancia") ctx.fillStyle = "rgba(197, 160, 89, " + (0.25 + intensity * 0.55) + ")";
        else if (type === "edicion") ctx.fillStyle = "rgba(14, 116, 144, " + (0.25 + intensity * 0.55) + ")";
        else ctx.fillStyle = "rgba(37, 99, 235, " + (0.25 + intensity * 0.55) + ")";

        ctx.fillRect(bx, h - barHeight, barWidth, barHeight);

        ctx.fillRect(bx, 0, barWidth, barHeight * 0.35);
      }

      var numLines = 6;

        else if (type === "edicion") ctx.fillStyle = "rgba(34, 211, 238, " + (pt.alpha + intensity * 0.4) + ")";

/* =========================================================
   PROMPT CARD COMPONENT
   ========================================================= */
function PromptCardBox(props) {
  var item = props.item;
  var themeClass = props.themeClass;
  var [copied, setCopied] = uA.useState(false);
  var [isHovered, setIsHovered] = uA.useState(false);

  function copyPrompt(e) {
    e.stopPropagation();
    if (navigator && navigator.clipboard) {
      navigator.clipboard.writeText(item.prompt).then(function() {
        setCopied(true);
        setTimeout(function() { setCopied(false); }, 2000);
      });
    }
  }

  return Z("div", {
    className: "prompt-box " + (isHovered ? "box-active-hover " : "") + (item.isComparison ? "prompt-box-comparison" : ""),
    children: [
      item.isComparison ? Z(BeforeAfterComparisonImage, {
        firstImage: item.image,
        secondImage: item.resultImage || item.originalImage,
        title: item.title,
        badge: item.badge
      }) : Z("div", {
        className: "prompt-box-image-wrap",
        children: [
          Z("img", {
            src: item.image,
            alt: item.title,
            className: "prompt-box-img",
            draggable: false
          }),
          Z("div", {
            className: "prompt-box-badge",
            children: item.badge
          })
        ]
      }),
      Z("div", {
        className: "prompt-box-content",
        children: [
          Z("div", {
            children: [
              Z("h3", {
                className: "prompt-box-title",
                children: item.title
              }),
              Z("p", {
                className: "prompt-box-desc",
                children: item.description
              })
            ]
          }),
          Z("button", {
            type: "button",
            onClick: copyPrompt,
            onMouseEnter: function() { setIsHovered(true); },
            onMouseLeave: function() { setIsHovered(false); },
            className: "prompt-command-btn" + (copied ? " btn-copied" : ""),
            children: copied ? "✓ ¡PROMPT COPIADO!" : "+ COPIAR PROMPT"
          })
        ]
      })
    ]
  });
}

/* =========================================================
   MASTER PROMPTS EXPERIENCE (5s Intro -> Clean Library)
   ========================================================= */
function MasterPromptsExperience(props) {
  var type = props.type;
  var onClose = props.onClose;

  var config = CATEGORY_DATA[type] || CATEGORY_DATA.anime;
  var audioInstance = getAudio(type);

  var [stagePhase, setStagePhase] = uA.useState("intro"); // "intro" | "library"
  var [progressPct, setProgressPct] = uA.useState(0);
  var [strobeScale, setStrobeScale] = uA.useState(0);
  var [currentLyrics, setCurrentLyrics] = uA.useState(config.lyrics && config.lyrics[0] ? { line1: config.lyrics[0].line1, line2: config.lyrics[0].line2 } : { line1: "", line2: "" });
  var [timecode, setTimecode] = uA.useState("00:00:00:00");

  // Skip Intro Handler: mutes/stops audio instantly and shows prompts library
  function handleSkipIntro() {
    stopAllAudios(0);
    setStagePhase("library");
  }

  // 5-Second Intro Loop
  uA.useEffect(function() {
    var startTime = performance.now();
    var INTRO_DURATION = 5.0;
    var rafId = null;
    var mounted = true;

    function loop(now) {
      if (!mounted) return;
      var elapsed = (now - startTime) / 1000;

      if (elapsed >= INTRO_DURATION) {
        setStagePhase("library");
        return;
      }

      setProgressPct((elapsed / INTRO_DURATION) * 100);

      // Beat calculation
      var kick = Math.pow(Math.max(0, Math.sin(elapsed * 7.5)), 6);
      var sub = Math.pow(Math.max(0, Math.sin(elapsed * 3.75 + 0.3)), 4);
      var strobeVal = kick * 0.85 + sub * 0.45;
      setStrobeScale(strobeVal);

      // HUD timecode
