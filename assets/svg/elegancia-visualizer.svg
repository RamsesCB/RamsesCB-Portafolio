<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Editorial Framing (Strictly under 4px border width) -->
  <rect x="45" y="45" width="310" height="310" rx="2" stroke="#d4af37" stroke-width="2" />
  <rect x="55" y="55" width="290" height="290" rx="1" stroke="rgba(212,175,55,0.4)" stroke-width="1" stroke-dasharray="6 4" />

  <!-- Harmonic Concentric Geometry -->
  <circle cx="200" cy="200" r="110" stroke="rgba(212,175,55,0.3)" stroke-width="1.5" />
  <circle cx="200" cy="200" r="75" stroke="#d4af37" stroke-width="2" filter="url(#goldGlow)" />
  <circle cx="200" cy="200" r="40" stroke="rgba(212,175,55,0.5)" stroke-width="1" />

  <!-- Crosshairs of Precision -->
  <line x1="200" y1="45" x2="200" y2="125" stroke="#d4af37" stroke-width="1.5" />
  <line x1="200" y1="275" x2="200" y2="355" stroke="#d4af37" stroke-width="1.5" />
  <line x1="45" y1="200" x2="125" y2="200" stroke="#d4af37" stroke-width="1.5" />
  <line x1="275" y1="200" x2="355" y2="200" stroke="#d4af37" stroke-width="1.5" />

  <!-- Symmetrical Harmonic Equalizer Spectrum -->
  <g class="eq-bars" fill="#d4af37" opacity="0.85">
    <rect x="135" y="190" width="4" height="20" rx="1" />
    <rect x="145" y="180" width="4" height="40" rx="1" />
    <rect x="155" y="170" width="4" height="60" rx="1" />
    <rect x="165" y="160" width="4" height="80" rx="1" />
    <rect x="175" y="150" width="4" height="100" rx="1" />
    <rect x="185" y="145" width="4" height="110" rx="1" />
    <rect x="197" y="140" width="6" height="120" rx="1" fill="#fff" />
    <rect x="211" y="145" width="4" height="110" rx="1" />
    <rect x="221" y="150" width="4" height="100" rx="1" />
    <rect x="231" y="160" width="4" height="80" rx="1" />
    <rect x="241" y="170" width="4" height="60" rx="1" />
    <rect x="251" y="180" width="4" height="40" rx="1" />
    <rect x="261" y="190" width="4" height="20" rx="1" />
  </g>
</svg>