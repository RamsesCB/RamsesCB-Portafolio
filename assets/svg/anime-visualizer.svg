<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <filter id="animeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="cyberLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Background Grid Frame -->
  <rect x="20" y="20" width="360" height="360" rx="8" stroke="rgba(88,166,255,0.3)" stroke-width="2" />
  <rect x="40" y="40" width="320" height="320" rx="4" stroke="rgba(188,140,255,0.4)" stroke-width="1.5" stroke-dasharray="8 6" />

  <!-- Diagonal Cyber Lasers -->
  <line x1="20" y1="20" x2="145" y2="145" stroke="url(#cyberLaser)" stroke-width="3" filter="url(#animeGlow)" />
  <line x1="380" y1="20" x2="255" y2="145" stroke="url(#cyberLaser)" stroke-width="3" filter="url(#animeGlow)" />
  <line x1="20" y1="380" x2="145" y2="255" stroke="url(#cyberLaser)" stroke-width="3" filter="url(#animeGlow)" />
  <line x1="380" y1="380" x2="255" y2="255" stroke="url(#cyberLaser)" stroke-width="3" filter="url(#animeGlow)" />

  <!-- Inner Diamond & Center Circle -->
  <polygon points="200,60 340,200 200,340 60,200" stroke="#58a6ff" stroke-width="2" fill="none" opacity="0.75" />
  <circle cx="200" cy="200" r="65" stroke="#bc8cff" stroke-width="2.5" fill="rgba(88,166,255,0.06)" />

  <!-- 16-Band Dynamic Equalizer Visualizer Spectrum -->
  <g class="eq-bars" fill="#58a6ff" opacity="0.85">
    <rect x="110" y="185" width="6" height="30" rx="2" />
    <rect x="122" y="175" width="6" height="50" rx="2" />
    <rect x="134" y="160" width="6" height="80" rx="2" />
    <rect x="146" y="150" width="6" height="100" rx="2" />
    <rect x="158" y="140" width="6" height="120" rx="2" />
    <rect x="170" y="130" width="6" height="140" rx="2" />
    <rect x="182" y="125" width="6" height="150" rx="2" />
    <rect x="194" y="120" width="12" height="160" rx="2" fill="#fff" />
    <rect x="212" y="125" width="6" height="150" rx="2" />
    <rect x="224" y="130" width="6" height="140" rx="2" />
    <rect x="236" y="140" width="6" height="120" rx="2" />
    <rect x="248" y="150" width="6" height="100" rx="2" />
    <rect x="260" y="160" width="6" height="80" rx="2" />
    <rect x="272" y="175" width="6" height="50" rx="2" />
    <rect x="284" y="185" width="6" height="30" rx="2" />
  </g>
</svg>